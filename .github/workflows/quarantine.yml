name: Quarantined Tests

on:
  schedule:
    # Run nightly at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

env:
  STELLAR_NETWORK: testnet
  JWT_SECRET: streampay-dev-secret-do-not-use-in-prod
  NODE_ENV: test
  CI: true

jobs:
  run-quarantined:
    name: Run Quarantined Suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run quarantined test suites
        continue-on-error: true
        run: npm run test:quarantine
